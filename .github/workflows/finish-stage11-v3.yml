name: Finish Stage 11 integration v3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply live Stage 11 server integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('services/game-server/src/server.ts');s=p.read_text()
          q=Path('services/game-server/src/stage11.ts');t=q.read_text();t=t.replace('residentIds.map(cleanId)','residentIds.map((residentId) => cleanId(residentId))');q.write_text(t)
          if 'from "./stage11"' not in s:
            i=s.index('import { TRANSPORT_WORKPLACE_ID')
            s=s[:i]+'import { STAGE11_BUSINESSES, STAGE11_SERVICES, STAGE11_FUEL_PRICE_PER_LITRE, assignStage11CourierDelivery, assignStage11RepairCall, assignStage11ServiceOrder, buyStage11Fuel, completeStage11CourierDelivery, completeStage11RepairCall, completeStage11ServiceOrder, createStage11State, normalizeStage11State, openStage11CourierDelivery, openStage11RepairCall, openStage11ServiceOrder, payStage11UtilityBill, pickupStage11CourierDelivery, registerStage11Property, registerStage11Vehicle, type Stage11Actor, type Stage11Property } from "./stage11";\n'+s[i:]
          if 'stage11?: unknown' not in s:s=s.replace('  stage9?: unknown;\n};','  stage9?: unknown;\n  stage11?: unknown;\n};')
          if 'let stage11State = createStage11State();' not in s:s=s.replace('let stage9State = createStage9State();','let stage9State = createStage9State();\nlet stage11State = createStage11State();')
          if 'async function saveStage11State' not in s:
            i=s.index('async function saveStage9State');s=s[:i]+'''async function saveStage11State(state = stage11State) {\n  if (pool) { await pool.query("INSERT INTO nrs_world(key,value,updated_at) VALUES ('stage11',$1::jsonb,$2) ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value, updated_at=EXCLUDED.updated_at", [JSON.stringify(state), Date.now()]); return; }\n  fileStore.stage11=state; writeFileStore();\n}\n\n'''+s[i:]
          if 'stage11State = normalizeStage11State(stage11Row' not in s:
            a='    stage9State = normalizeStage9State(stage9Row.rows[0]?.value);\n    await saveStage9State();'
            if a in s:s=s.replace(a,a+'\n    const stage11Row = await pool.query("SELECT value FROM nrs_world WHERE key=\'stage11\' LIMIT 1");\n    stage11State = normalizeStage11State(stage11Row.rows[0]?.value);\n    await saveStage11State();')
          if 'stage11State = normalizeStage11State(fileStore.stage11)' not in s:
            a='  stage9State = normalizeStage9State(fileStore.stage9);\n  await saveStage9State();'
            if a in s:s=s.replace(a,a+'\n  stage11State = normalizeStage11State(fileStore.stage11);\n  await saveStage11State();')
          if 'function stage11Actor(session:Session)' not in s:
            i=s.index('function stage9Actor(session:Session)')
            s=s[:i]+'''function stage11Actor(session:Session):Stage11Actor { const e=session.player.life.employment??null; return {actorId:session.player.id,workplaceId:e?.workplaceId??"",rank:Number(e?.rank??0),onDuty:e?.onDuty===true,uniform:!!e&&e.uniformWorkplaceId===e.workplaceId,x:session.player.x,z:session.player.z}; }\nfunction stage11Vehicle(session:Session,id:string){if(!id||!session.player.life.ownedCars.includes(id))return null;const old=stage11State.vehicles[id];registerStage11Vehicle(stage11State,{id,ownerId:session.player.id,x:session.player.x,z:session.player.z,fuelLitres:old?Math.min(old.fuelLitres,session.player.fuel[id]??20):(session.player.fuel[id]??20),fuelCapacityLitres:40,condition:old?.condition??70,cleanliness:old?.cleanliness??70});return stage11State.vehicles[id]??null;}\nfunction stage11Property(session:Session):Stage11Property|null{const hid=session.player.life.homeId;if(!hid||world.houseTenants[hid]!==session.player.id)return null;const h=findHouse(hid);if(!h)return null;const id="house:"+hid;const old=stage11State.properties[id];registerStage11Property(stage11State,{id,ownerId:session.player.id,residentIds:[],x:h.x,z:h.z,bills:old?.bills??{electricity:{amountDue:8000,paidAt:null},water:{amountDue:3000,paidAt:null},waste:{amountDue:1500,paidAt:null}},issues:old?.issues??[]});return stage11State.properties[id]??null;}\nfunction stage11Payload(session:Session){return {type:"stage11State",cash:session.player.cash,businesses:STAGE11_BUSINESSES,services:STAGE11_SERVICES,fuelPricePerLitre:STAGE11_FUEL_PRICE_PER_LITRE,ownedVehicles:session.player.life.ownedCars.map(id=>stage11Vehicle(session,id)).filter(Boolean),property:stage11Property(session),serviceOrders:stage11State.serviceOrders.slice(-30).reverse(),repairCalls:stage11State.repairCalls.slice(-30).reverse(),deliveries:stage11State.deliveries.slice(-30).reverse(),utilityPayments:stage11State.utilityPayments.filter(x=>x.customerId===session.player.id).slice(-20).reverse()};}\nfunction stage11Result(session:Session,action:string,r:any){send(session.socket,{...stage11Payload(session),type:"stage11ActionResult",action,ok:r.ok,result:r.ok?r.result:null,reason:r.ok?null:r.reason});}\n\n'''+s[i:]
          if 'message.type === "getStage11State"' not in s:
            i=s.index('      if (message.type === "getStage9State")')
            block='''      if (message.type === "getStage11State") { send(socket,stage11Payload(session)); return; }\n      if (message.type === "stage11BuyFuel") { await withMoneyMutation(async()=>{const worker=players.get(String(message.workerId??"")),v=stage11Vehicle(session,String(message.vehicleId??""));if(!worker||worker.player.id===session.player.id||!v){stage11Result(session,"fuel",{ok:false,reason:"invalid_participants"});return;}const r=buyStage11Fuel({state:stage11State,requestId:String(message.requestId??""),customerId:session.player.id,vehicleId:v.id,litres:Number(message.litres),customerCash:session.player.cash,actor:stage11Actor(worker),now:Date.now()});if(!r.ok){stage11Result(session,"fuel",r);return;}const old=session.player.cash;session.player.cash-=r.result.total;session.player.fuel[v.id]=r.result.fuelRemaining;try{await persistSession(session);await saveStage11State();stage11Result(session,"fuel",r);broadcastStage11States();}catch(e){session.player.cash=old;stage11Result(session,"fuel",{ok:false,reason:"persist_failed"});}});return;}\n      if (message.type === "stage11OpenService") {const x=STAGE11_SERVICES.find(v=>v.id===String(message.serviceId??"")),b=x&&stage11State.businesses[x.businessId];if(!x||!b||Math.hypot(session.player.x-b.x,session.player.z-b.z)>24){stage11Result(session,"service-open",{ok:false,reason:"customer_not_at_business"});return;}if(x.requiresVehicle&&!stage11Vehicle(session,String(message.vehicleId??""))){stage11Result(session,"service-open",{ok:false,reason:"vehicle_not_owned"});return;}const r=openStage11ServiceOrder({state:stage11State,requestId:String(message.requestId??""),customerId:session.player.id,serviceId:x.id,targetVehicleId:x.requiresVehicle?String(message.vehicleId??""):null,now:Date.now()});if(r.ok)await saveStage11State();stage11Result(session,"service-open",r);return;}\n      if (message.type === "stage11AssignService") {const t=players.get(String(message.workerId??""));const r=t?assignStage11ServiceOrder({state:stage11State,orderId:String(message.orderId??""),supervisor:stage11Actor(session),assignee:stage11Actor(t)}):{ok:false,reason:"invalid_assignee"};if(r.ok)await saveStage11State();stage11Result(session,"service-assign",r);return;}\n      if (message.type === "stage11CompleteService") {await withMoneyMutation(async()=>{const o=stage11State.serviceOrders.find(v=>v.id===String(message.orderId??"")),c=o?players.get(o.customerId):null;if(!c){stage11Result(session,"service-complete",{ok:false,reason:"customer_offline"});return;}const r=completeStage11ServiceOrder({state:stage11State,orderId:o.id,customerCash:c.player.cash,actor:stage11Actor(session),now:Date.now()});if(!r.ok){stage11Result(session,"service-complete",r);return;}const old=c.player.cash;c.player.cash-=r.result.total;try{await persistSession(c);await saveStage11State();stage11Result(session,"service-complete",r);broadcastStage11States();}catch(e){c.player.cash=old;stage11Result(session,"service-complete",{ok:false,reason:"persist_failed"});}});return;}\n      if (message.type === "stage11OpenRepair") {const p=stage11Property(session);if(!p){stage11Result(session,"repair-open",{ok:false,reason:"property_access_denied"});return;}const r=openStage11RepairCall({state:stage11State,requestId:String(message.requestId??""),customerId:session.player.id,propertyId:p.id,kind:String(message.kind??"") as any,description:String(message.description??""),now:Date.now()});if(r.ok)await saveStage11State();stage11Result(session,"repair-open",r);return;}\n      if (message.type === "stage11AssignRepair") {const t=players.get(String(message.workerId??""));const r=t?assignStage11RepairCall({state:stage11State,callId:String(message.callId??""),supervisor:stage11Actor(session),assignee:stage11Actor(t)}):{ok:false,reason:"invalid_assignee"};if(r.ok)await saveStage11State();stage11Result(session,"repair-assign",r);return;}\n      if (message.type === "stage11CompleteRepair") {await withMoneyMutation(async()=>{const q=stage11State.repairCalls.find(v=>v.id===String(message.callId??"")),c=q?players.get(q.customerId):null;if(!c){stage11Result(session,"repair-complete",{ok:false,reason:"customer_offline"});return;}const r=completeStage11RepairCall({state:stage11State,callId:q.id,customerCash:c.player.cash,actor:stage11Actor(session),now:Date.now()});if(!r.ok){stage11Result(session,"repair-complete",r);return;}const old=c.player.cash;c.player.cash-=r.result.price;try{await persistSession(c);await saveStage11State();stage11Result(session,"repair-complete",r);broadcastStage11States();}catch(e){c.player.cash=old;stage11Result(session,"repair-complete",{ok:false,reason:"persist_failed"});}});return;}\n      if (message.type === "stage11PayUtility") {const p=stage11Property(session);if(!p){stage11Result(session,"utility",{ok:false,reason:"property_access_denied"});return;}await withMoneyMutation(async()=>{const r=payStage11UtilityBill({state:stage11State,requestId:String(message.requestId??""),customerId:session.player.id,propertyId:p.id,utility:String(message.utility??"") as any,customerCash:session.player.cash,now:Date.now()});if(!r.ok){stage11Result(session,"utility",r);return;}const old=session.player.cash;session.player.cash-=r.result.amount;try{await persistSession(session);await saveStage11State();stage11Result(session,"utility",r);}catch(e){session.player.cash=old;stage11Result(session,"utility",{ok:false,reason:"persist_failed"});}});return;}\n      if (message.type === "stage11OpenCourier") {const h=stage11State.businesses["courier-hub-main"];if(!h||Math.hypot(session.player.x-h.x,session.player.z-h.z)>24){stage11Result(session,"courier-open",{ok:false,reason:"customer_not_at_hub"});return;}const r=openStage11CourierDelivery({state:stage11State,requestId:String(message.requestId??""),customerId:session.player.id,recipientName:String(message.recipientName??""),parcelDescription:String(message.parcelDescription??""),dropoffX:Number(message.dropoffX),dropoffZ:Number(message.dropoffZ),now:Date.now()});if(r.ok)await saveStage11State();stage11Result(session,"courier-open",r);return;}\n      if (message.type === "stage11AssignCourier") {const t=players.get(String(message.workerId??""));const r=t?assignStage11CourierDelivery({state:stage11State,deliveryId:String(message.deliveryId??""),supervisor:stage11Actor(session),assignee:stage11Actor(t)}):{ok:false,reason:"invalid_assignee"};if(r.ok)await saveStage11State();stage11Result(session,"courier-assign",r);return;}\n      if (message.type === "stage11PickupCourier") {const r=pickupStage11CourierDelivery({state:stage11State,deliveryId:String(message.deliveryId??""),actor:stage11Actor(session),now:Date.now()});if(r.ok)await saveStage11State();stage11Result(session,"courier-pickup",r);return;}\n      if (message.type === "stage11CompleteCourier") {await withMoneyMutation(async()=>{const d=stage11State.deliveries.find(v=>v.id===String(message.deliveryId??"")),c=d?players.get(d.customerId):null;if(!c){stage11Result(session,"courier-complete",{ok:false,reason:"customer_offline"});return;}const r=completeStage11CourierDelivery({state:stage11State,deliveryId:d.id,customerCash:c.player.cash,actor:stage11Actor(session),now:Date.now()});if(!r.ok){stage11Result(session,"courier-complete",r);return;}const old=c.player.cash;c.player.cash-=r.result.price;try{await persistSession(c);await saveStage11State();stage11Result(session,"courier-complete",r);broadcastStage11States();}catch(e){c.player.cash=old;stage11Result(session,"courier-complete",{ok:false,reason:"persist_failed"});}});return;}\n\n'''
            s=s[:i]+block+s[i:]
          p.write_text(s)
          PY
      - name: Test and build
        working-directory: services/game-server
        run: |
          npm install --no-audit --no-fund
          npm run test:stage11
          npm run build
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/game-server/src/server.ts services/game-server/src/stage11.ts
          git diff --cached --quiet && exit 0
          git commit -m "Stage 11: complete live gameplay integration [skip ci]"
          git push origin main
