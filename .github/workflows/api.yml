name: NRS API CI

on:
  push:
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package.json

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
