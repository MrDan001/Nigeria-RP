name: Game Server CI

on:
  push:
    branches: [main]
    paths:
      - "services/game-server/**"
      - "services/web-client/**"
      - "package.json"
      - ".github/workflows/game-server.yml"
  pull_request:
    paths:
      - "services/game-server/**"
      - "services/web-client/**"
      - "package.json"
      - ".github/workflows/game-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-game-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Typecheck game server
        run: npm run typecheck --workspace nigeria-rp-game-server

      - name: Test Stage 1 rules
        run: npm run test:stage1 --workspace nigeria-rp-game-server

      - name: Test Stage 2 housing rules
        run: npm run test:stage2 --workspace nigeria-rp-game-server

      - name: Test Stage 3 workplace rules and payout history
        run: npm run test:stage3 --workspace nigeria-rp-game-server

      - name: Test Stage 4 market and bank rules
        run: npm run test:stage4 --workspace nigeria-rp-game-server

      - name: Test Stage 5 hospital and park interactions
        run: npm run test:stage5 --workspace nigeria-rp-game-server

      - name: Test Stage 6 government treasury and civic finance
        run: npm run test:stage6 --workspace nigeria-rp-game-server

      - name: Test Stage 7 public-safety incident rules
        run: npm run test:stage7 --workspace nigeria-rp-game-server

      - name: Test Stage 8 newsroom workflow
        run: npm run test:stage8 --workspace nigeria-rp-game-server

      - name: Test Stage 9 transport and haulage rules
        run: npm run test:stage9 --workspace nigeria-rp-game-server

      - name: Test Stage 10 food shops and service transactions
        run: npm run test:stage10 --workspace nigeria-rp-game-server

      - name: Test Stage 11 personal services and utilities
        run: npm run test:stage11 --workspace nigeria-rp-game-server

      - name: Test Stage 12 education, office and industry rules
        run: npm run test:stage12 --workspace nigeria-rp-game-server

      - name: Test Stage 13 economy safety rules
        run: npm run test:stage13 --workspace nigeria-rp-game-server

      - name: Test Stage 14 release, load and recovery validation
        run: npm run test:stage14 --workspace nigeria-rp-game-server

      - name: Test Stage 15 city and inter-city travel rules
        run: npm run test:stage15 --workspace nigeria-rp-game-server

      - name: Test live Stage 15 travel transaction, persistence and replay safety
        run: npm run test:stage15:live --workspace nigeria-rp-game-server

      - name: Test Stage 16 city environment catalogue
        run: npm run test:stage16 --workspace nigeria-rp-game-server

      - name: Test Stage 17 city explorer passport and discovery rewards
        run: npm run test:stage17 --workspace nigeria-rp-game-server

      - name: Build game server
        run: npm run build --workspace nigeria-rp-game-server

      - name: Build browser client
        run: npm run build --workspace nigeria-rp-web-client
