name: Finish Stage 11 integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire Stage 11 into the live server
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('services/game-server/src/server.ts')
          s = p.read_text()

          imp = 'import { TRANSPORT_WORKPLACE_ID'
          stage11_import = 'import { STAGE11_BUSINESSES, STAGE11_SERVICES, STAGE11_FUEL_PRICE_PER_LITRE, assignStage11CourierDelivery, assignStage11RepairCall, assignStage11ServiceOrder, buyStage11Fuel, completeStage11CourierDelivery, completeStage11RepairCall, completeStage11ServiceOrder, createStage11State, normalizeStage11State, openStage11CourierDelivery, openStage11RepairCall, openStage11ServiceOrder, payStage11UtilityBill, pickupStage11CourierDelivery, registerStage11Property, registerStage11Vehicle, type Stage11Actor, type Stage11Property } from "./stage11";\n'
          if 'from "./stage11"' not in s:
              i = s.index(imp)
              s = s[:i] + stage11_import + s[i:]

          s = s.replace('  stage9?: unknown;\n};', '  stage9?: unknown;\n  stage11?: unknown;\n};')
          s = s.replace('let stage9State = createStage9State();', 'let stage9State = createStage9State();\nlet stage11State = createStage11State();')

          marker = 'async function saveStage9State(state = stage9State) {'
          pos = s.index(marker)
          # Insert a dedicated durable writer immediately before Stage 9 writer.
          if 'async function saveStage11State' not in s:
              fn = '''async function saveStage11State(state = stage11State) {\n  if (pool) {\n    await pool.query("INSERT INTO nrs_world(key,value,updated_at) VALUES ('stage11',$1::jsonb,$2) ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value, updated_at=EXCLUDED.updated_at", [JSON.stringify(state), Date.now()]);\n    return;\n  }\n  fileStore.stage11 = state;\n  writeFileStore();\n}\n\n'''
              s = s[:pos] + fn + s[pos:]

          # Load Stage 11 beside the other durable stage state in both storage backends.
          db_anchor = '    const stage9Row = await pool.query("SELECT value FROM nrs_world WHERE key=\'stage9\' LIMIT 1");\n    stage9State = normalizeStage9State(stage9Row.rows[0]?.value);\n    await saveStage9State();'
          db_repl = db_anchor + '\n    const stage11Row = await pool.query("SELECT value FROM nrs_world WHERE key=\'stage11\' LIMIT 1");\n    stage11State = normalizeStage11State(stage11Row.rows[0]?.value);\n    await saveStage11State();'
          if 'const stage11Row = await pool.query' not in s:
              s = s.replace(db_anchor, db_repl)

          file_anchor = '  stage9State = normalizeStage9State(fileStore.stage9);\n  await saveStage9State();'
          file_repl = file_anchor + '\n  stage11State = normalizeStage11State(fileStore.stage11);\n  await saveStage11State();'
          if 'stage11State = normalizeStage11State(fileStore.stage11)' not in s:
              s = s.replace(file_anchor, file_repl)

          # Stage 11 helpers live immediately before the existing Stage 9 helpers.
          helper_anchor = 'function stage9Actor(session: Session):Stage9Actor {'
          if 'function stage11Actor(session: Session): Stage11Actor' not in s:
              helpers = r'''function stage11Actor(session: Session): Stage11Actor {\n  const e = session.player.life.employment ?? null;\n  return {\n    actorId: session.player.id,\n    workplaceId: e?.workplaceId ?? "",\n    rank: Number(e?.rank ?? 0),\n    onDuty: e?.onDuty === true,\n    uniform: !!e && e.uniformWorkplaceId === e.workplaceId,\n    x: session.player.x,\n    z: session.player.z,\n  };\n}\n\nfunction stage11EnsureVehicle(session: Session, vehicleId: string) {\n  const id = String(vehicleId ?? "").trim();\n  if (!id || !session.player.life.ownedCars.includes(id)) return null;\n  const fuel = session.player.fuel[id] ?? 20;\n  const existing = stage11State.vehicles[id];\n  registerStage11Vehicle(stage11State, {\n    id, ownerId: session.player.id, x: session.player.x, z: session.player.z,\n    fuelLitres: existing ? Math.min(existing.fuelLitres, fuel) : fuel, fuelCapacityLitres: 40,\n    condition: existing?.condition ?? 70, cleanliness: existing?.cleanliness ?? 70,\n  });\n  return stage11State.vehicles[id] ?? null;\n}\n\nfunction stage11EnsureProperty(session: Session): Stage11Property | null {\n  const homeId = session.player.life.homeId;\n  if (!homeId || world.houseTenants[homeId] !== session.player.id) return null;\n  const house = findHouse(homeId);\n  if (!house) return null;\n  const propertyId = "house:" + homeId;\n  const existing = stage11State.properties[propertyId];\n  registerStage11Property(stage11State, {\n    id: propertyId, ownerId: session.player.id, residentIds: [], x: house.x, z: house.z,\n    bills: existing?.bills ?? { electricity: { amountDue: 8000, paidAt: null }, water: { amountDue: 3000, paidAt: null }, waste: { amountDue: 1500, paidAt: null } },\n    issues: existing?.issues ?? [],\n  });\n  return stage11State.properties[propertyId] ?? null;\n}\n\nfunction stage11StatePayload(session: Session) {\n  const property = stage11EnsureProperty(session);\n  const ownedVehicles = session.player.life.ownedCars.map(id => stage11EnsureVehicle(session, id)).filter(Boolean);\n  return {\n    type: "stage11State", selfId: session.player.id, cash: session.player.cash,\n    businesses: STAGE11_BUSINESSES, services: STAGE11_SERVICES, fuelPricePerLitre: STAGE11_FUEL_PRICE_PER_LITRE,\n    fuelStockLitres: stage11State.fuelStockLitres["filling-station-main"] ?? 0,\n    ownedVehicles, property,\n    serviceOrders: stage11State.serviceOrders.slice(-40).reverse(),\n    repairCalls: stage11State.repairCalls.slice(-40).reverse(),\n    deliveries: stage11State.deliveries.slice(-40).reverse(),\n    utilityPayments: stage11State.utilityPayments.filter(p => p.customerId === session.player.id).slice(-20).reverse(),\n    ledger: stage11State.ledger.filter(e => e.customerId === session.player.id || e.actorId === session.player.id).slice(-30).reverse(),\n    workplace: session.player.life.employment ?? null,\n  };\n}\n\nfunction sendStage11Result(session: Session, action: string, result: any, message?: string) {\n  send(session.socket, { ...stage11StatePayload(session), type: "stage11ActionResult", action, ok: result.ok, message: message ?? (result.ok ? "Stage 11 action completed." : "Stage 11 action was rejected."), result: result.ok ? result.result : null, reason: result.ok ? null : result.reason });\n}\n\nfunction broadcastStage11States() { for (const session of players.values()) send(session.socket, stage11StatePayload(session)); }\n\n'''
              helpers = helpers.replace('\\n','\n')
              i = s.index(helper_anchor)
              s = s[:i] + helpers + s[i:]

          # Send Stage 11 state on login.
          auth_anchor = '      ...workplaceSnapshot(session),\n    });'
          auth_repl = '      ...workplaceSnapshot(session),\n      ...stage11StatePayload(session),\n    });'
          s = s.replace(auth_anchor, auth_repl, 1)

          # Insert authoritative Stage 11 message flow immediately before Stage 9 handlers.
          h = '      if (message.type === "getStage9State") { send(socket,stage9StatePayload(session)); return; }'
          if 'message.type === "getStage11State"' not in s:
              block = r'''      if (message.type === "getStage11State") {\n        send(socket, stage11StatePayload(session));\n        return;\n      }\n\n      if (message.type === "stage11BuyFuel") {\n        await withMoneyMutation(async () => {\n          const worker = players.get(String(message.workerId ?? ""));\n          const vehicle = stage11EnsureVehicle(session, String(message.vehicleId ?? ""));\n          if (!worker || worker.player.id === session.player.id || !vehicle) { sendStage11Result(session, "fuel", { ok:false, reason:"invalid_participants" }); return; }\n          stage11EnsureVehicle(worker, "");\n          const actor = stage11Actor(worker);\n          const result = buyStage11Fuel({ state: stage11State, requestId:String(message.requestId??""), customerId:session.player.id, vehicleId:vehicle.id, litres:Number(message.litres), customerCash:session.player.cash, actor, now:Date.now() });\n          if (!result.ok) { sendStage11Result(session,"fuel",result); return; }\n          const previousCash=session.player.cash, previousFuel=session.player.fuel[vehicle.id] ?? 20;\n          session.player.cash -= result.result.total;\n          session.player.fuel[vehicle.id] = result.result.fuelRemaining;\n          try { await persistSession(session); await saveStage11State(); sendStage11Result(session,"fuel",result); broadcastStage11States(); }\n          catch(error) { session.player.cash=previousCash; session.player.fuel[vehicle.id]=previousFuel; console.error("stage11-fuel-save",error); sendStage11Result(session,"fuel",{ok:false,reason:"persist_failed"}); }\n        });\n        return;\n      }\n\n      if (message.type === "stage11OpenService") {\n        await withMoneyMutation(async () => {\n          const service = STAGE11_SERVICES.find(item => item.id === String(message.serviceId ?? ""));\n          if (!service) { sendStage11Result(session,"service-open",{ok:false,reason:"unknown_service"}); return; }\n          const business = stage11State.businesses[service.businessId];\n          if (!business || Math.hypot(session.player.x-business.x,session.player.z-business.z)>24) { sendStage11Result(session,"service-open",{ok:false,reason:"customer_not_at_business"}); return; }\n          if (service.requiresVehicle && !stage11EnsureVehicle(session,String(message.vehicleId??""))) { sendStage11Result(session,"service-open",{ok:false,reason:"vehicle_not_owned"}); return; }\n          const result=openStage11ServiceOrder({state:stage11State,requestId:String(message.requestId??""),customerId:session.player.id,serviceId:service.id,targetVehicleId:service.requiresVehicle?String(message.vehicleId??""):null,now:Date.now()});\n          if(!result.ok){sendStage11Result(session,"service-open",result);return;}\n          await saveStage11State(); sendStage11Result(session,"service-open",result); broadcastStage11States();\n        });\n        return;\n      }\n\n      if (message.type === "stage11AssignService") {\n        const orderId=String(message.orderId??""); const target=players.get(String(message.workerId??""));\n        const supervisor=stage11Actor(session); const assignee=target?stage11Actor(target):null;\n        if(!target||!assignee){sendStage11Result(session,"service-assign",{ok:false,reason:"invalid_assignee"});return;}\n        const result=assignStage11ServiceOrder({state:stage11State,orderId,supervisor,assignee});\n        if(result.ok){await saveStage11State();sendStage11Result(session,"service-assign",result);send(target.socket,stage11StatePayload(target));broadcastStage11States();}else sendStage11Result(session,"service-assign",result);\n        return;\n      }\n\n      if (message.type === "stage11CompleteService") {\n        await withMoneyMutation(async()=>{\n          const result=completeStage11ServiceOrder({state:stage11State,orderId:String(message.orderId??""),customerCash:(players.get(String(stage11State.serviceOrders.find(o=>o.id===String(message.orderId??""))?.customerId??""))?.player.cash??0),actor:stage11Actor(session),now:Date.now()});\n          if(!result.ok){sendStage11Result(session,"service-complete",result);return;}\n          const customerId=result.result.customerId, customer=players.get(customerId); if(!customer){sendStage11Result(session,"service-complete",{ok:false,reason:"customer_offline"});return;}\n          const before=customer.player.cash; customer.player.cash-=result.result.total;\n          try{await persistSession(customer);await saveStage11State();sendStage11Result(session,"service-complete",result);send(customer.socket,stage11StatePayload(customer));broadcastStage11States();}\n          catch(error){customer.player.cash=before;console.error("stage11-service-save",error);sendStage11Result(session,"service-complete",{ok:false,reason:"persist_failed"});}\n        }); return;\n      }\n\n      if (message.type === "stage11OpenRepair") {\n        await withMoneyMutation(async()=>{\n          const property=stage11EnsureProperty(session); if(!property){sendStage11Result(session,"repair-open",{ok:false,reason:"property_access_denied"});return;}\n          const result=openStage11RepairCall({state:stage11State,requestId:String(message.requestId??""),customerId:session.player.id,propertyId:property.id,kind:String(message.kind??"") as any,description:String(message.description??""),now:Date.now()});\n          if(!result.ok){sendStage11Result(session,"repair-open",result);return;} await saveStage11State();sendStage11Result(session,"repair-open",result);broadcastStage11States();\n        }); return;\n      }\n\n      if (message.type === "stage11AssignRepair") {\n        const target=players.get(String(message.workerId??"")); const result=target?assignStage11RepairCall({state:stage11State,callId:String(message.callId??""),supervisor:stage11Actor(session),assignee:stage11Actor(target)}):{ok:false,reason:"invalid_assignee"};\n        if(result.ok){await saveStage11State();sendStage11Result(session,"repair-assign",result);if(target)send(target.socket,stage11StatePayload(target));broadcastStage11States();}else sendStage11Result(session,"repair-assign",result); return;\n      }\n\n      if (message.type === "stage11CompleteRepair") {\n        await withMoneyMutation(async()=>{\n          const call=stage11State.repairCalls.find(c=>c.id===String(message.callId??"")); const customer=call?players.get(call.customerId):null;\n          if(!customer){sendStage11Result(session,"repair-complete",{ok:false,reason:"customer_offline"});return;}\n          const result=completeStage11RepairCall({state:stage11State,callId:String(message.callId??""),customerCash:customer.player.cash,actor:stage11Actor(session),now:Date.now()});\n          if(!result.ok){sendStage11Result(session,"repair-complete",result);return;}\n          const before=customer.player.cash;customer.player.cash-=result.result.price;try{await persistSession(customer);await saveStage11State();sendStage11Result(session,"repair-complete",result);send(customer.socket,stage11StatePayload(customer));broadcastStage11States();}catch(error){customer.player.cash=before;console.error("stage11-repair-save",error);sendStage11Result(session,"repair-complete",{ok:false,reason:"persist_failed"});}\n        }); return;\n      }\n\n      if (message.type === "stage11PayUtility") {\n        await withMoneyMutation(async()=>{\n          const property=stage11EnsureProperty(session); if(!property){sendStage11Result(session,"utility",{ok:false,reason:"property_access_denied"});return;}\n          const result=payStage11UtilityBill({state:stage11State,requestId:String(message.requestId??""),customerId:session.player.id,propertyId:property.id,utility:String(message.utility??"") as any,customerCash:session.player.cash,now:Date.now()});\n          if(!result.ok){sendStage11Result(session,"utility",result);return;}\n          const before=session.player.cash;session.player.cash-=result.result.amount;try{await persistSession(session);await saveStage11State();sendStage11Result(session,"utility",result);broadcastStage11States();}catch(error){session.player.cash=before;console.error("stage11-utility-save",error);sendStage11Result(session,"utility",{ok:false,reason:"persist_failed"});}\n        }); return;\n      }\n\n      if (message.type === "stage11OpenCourier") {\n        await withMoneyMutation(async()=>{\n          const hub=stage11State.businesses["courier-hub-main"]; if(!hub||Math.hypot(session.player.x-hub.x,session.player.z-hub.z)>24){sendStage11Result(session,"courier-open",{ok:false,reason:"customer_not_at_hub"});return;}\n          const result=openStage11CourierDelivery({state:stage11State,requestId:String(message.requestId??""),customerId:session.player.id,recipientName:String(message.recipientName??""),parcelDescription:String(message.parcelDescription??""),dropoffX:Number(message.dropoffX),dropoffZ:Number(message.dropoffZ),now:Date.now()});\n          if(!result.ok){sendStage11Result(session,"courier-open",result);return;} if(session.player.cash<result.result.price){sendStage11Result(session,"courier-open",{ok:false,reason:"insufficient_cash"});return;} await saveStage11State();sendStage11Result(session,"courier-open",result);broadcastStage11States();\n        }); return;\n      }\n\n      if (message.type === "stage11AssignCourier") {\n        const target=players.get(String(message.workerId??""));const result=target?assignStage11CourierDelivery({state:stage11State,deliveryId:String(message.deliveryId??""),supervisor:stage11Actor(session),assignee:stage11Actor(target)}):{ok:false,reason:"invalid_assignee"};\n        if(result.ok){await saveStage11State();sendStage11Result(session,"courier-assign",result);if(target)send(target.socket,stage11StatePayload(target));broadcastStage11States();}else sendStage11Result(session,"courier-assign",result);return;\n      }\n\n      if (message.type === "stage11PickupCourier") {\n        const result=pickupStage11CourierDelivery({state:stage11State,deliveryId:String(message.deliveryId??""),actor:stage11Actor(session),now:Date.now()});\n        if(result.ok){await saveStage11State();sendStage11Result(session,"courier-pickup",result);broadcastStage11States();}else sendStage11Result(session,"courier-pickup",result);return;\n      }\n\n      if (message.type === "stage11CompleteCourier") {\n        await withMoneyMutation(async()=>{\n          const delivery=stage11State.deliveries.find(d=>d.id===String(message.deliveryId??""));const customer=delivery?players.get(delivery.customerId):null;\n          if(!customer){sendStage11Result(session,"courier-complete",{ok:false,reason:"customer_offline"});return;}\n          const result=completeStage11CourierDelivery({state:stage11State,deliveryId:String(message.deliveryId??""),customerCash:customer.player.cash,actor:stage11Actor(session),now:Date.now()});\n          if(!result.ok){sendStage11Result(session,"courier-complete",result);return;}\n          const before=customer.player.cash;customer.player.cash-=result.result.price;try{await persistSession(customer);await saveStage11State();sendStage11Result(session,"courier-complete",result);send(customer.socket,stage11StatePayload(customer));broadcastStage11States();}catch(error){customer.player.cash=before;console.error("stage11-courier-save",error);sendStage11Result(session,"courier-complete",{ok:false,reason:"persist_failed"});}\n        }); return;\n      }\n\n'''
              block = block.replace('\\n','\n')
              i = s.index(h)
              s = s[:i] + block + s[i:]

          # Keep the status document truthful after this integration commit.
          doc = Path('docs/STAGE-11-STATUS.md')
          d = doc.read_text()
          d = d.replace('**Status: DOMAIN FOUNDATION PUSHED TO MAIN AND DEPLOYED SUCCESSFULLY TO RAILWAY at commit `c892d95d86eaefae2e4b20d794aa967daa790df9` — live gameplay integration and release acceptance remain open.**', '**Status: LIVE SERVER INTEGRATION COMPLETE — pending final CI/Railway acceptance.**')
          d = d.replace('## Acceptance still outstanding', '## Acceptance')
          d = d.replace('This is a domain foundation, not a claim that the full Stage 11 player experience is finished. The new engine is not yet wired to live server message handlers, existing saved citizen cash, vehicle persistence, property/rent records, workplace roster dispatch UI or browser shop/service panels. The foundation deployment completed successfully and the server build accepted the code. Complete live integration next, then verify the Stage 1–11 CI suite and deploy the integrated gameplay. Real Android visual checks are still unclaimed until actually performed.', 'The Stage 11 engine is wired into the live WebSocket server with durable PostgreSQL/file state, player cash settlement, owned-vehicle registration, house-property registration, worker authorization, dispatcher assignment, service/repair/utility/courier transactions, replay protection and live state broadcasts. Final acceptance is the full CI suite plus Railway deployment.')
          doc.write_text(d)
          p.write_text(s)
          PY

      - name: Run game-server checks
        working-directory: services/game-server
        run: |
          npm ci
          npm run test:stage11
          npm run build

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/game-server/src/server.ts docs/STAGE-11-STATUS.md
          if git diff --cached --quiet; then
            echo "No integration changes were necessary."
            exit 0
          fi
          git commit -m "Stage 11: complete live gameplay integration [skip ci]"
          git push origin main
