name: Finish Stage 12 Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run test:stage12 --workspace nigeria-rp-game-server
      - name: Integrate Stage 12 server authority
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('services/game-server/src/server.ts')
          s = p.read_text()

          s = s.replace(
              'import { TRANSPORT_WORKPLACE_ID, STAGE9_DEPOT,',
              'import { STAGE12_BUSINESSES, STAGE12_FACILITIES, STAGE12_PRODUCTIONS, completeStage12SchoolBusTrip, completeStage12ProfessionalTask, completeStage12Shift, createStage12OfficeTask, createStage12State, awardStage12EducationTask, checkStage12FacilityAccess, maintainStage12Facility, normalizeStage12State, startStage12Shift, type Stage12Actor } from "./stage12";\nimport { completeStage12SchoolBusTrip as completeStage12SchoolBusTripExtra, completeStage12ProfessionalTask as completeStage12ProfessionalTaskExtra } from "./stage12-extra";\nimport { TRANSPORT_WORKPLACE_ID, STAGE9_DEPOT,'
          )
          # Correct the accidental duplicate helper import by using the extra module for both functions.
          s = s.replace('completeStage12SchoolBusTrip, completeStage12ProfessionalTask,', '')

          s = s.replace('  stage11?: unknown;\n};', '  stage11?: unknown;\n  stage12?: unknown;\n};')
          s = s.replace('let stage11State = createStage11State();', 'let stage11State = createStage11State();\nlet stage12State = createStage12State();')

          anchor = 'async function saveStage9State(state = stage9State) {'
          insert = '''async function saveStage12State(state = stage12State) {\n  if (pool) { await pool.query("INSERT INTO nrs_world(key,value,updated_at) VALUES ('stage12',$1::jsonb,$2) ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value, updated_at=EXCLUDED.updated_at", [JSON.stringify(state), Date.now()]); return; }\n  fileStore.stage12 = state; writeFileStore();\n}\n\n'''
          if 'async function saveStage12State' not in s:
              s = s.replace(anchor, insert + anchor)

          pg_anchor = '    const stage11Row = await pool.query("SELECT value FROM nrs_world WHERE key=\'stage11\' LIMIT 1");\n    stage11State = normalizeStage11State(stage11Row.rows[0]?.value);\n    await saveStage11State();'
          pg_insert = pg_anchor + '\n    const stage12Row = await pool.query("SELECT value FROM nrs_world WHERE key=\'stage12\' LIMIT 1");\n    stage12State = normalizeStage12State(stage12Row.rows[0]?.value);\n    await saveStage12State();'
          if 'const stage12Row = await pool.query' not in s:
              s = s.replace(pg_anchor, pg_insert)

          fb_anchor = '  stage11State = normalizeStage11State(fileStore.stage11);\n  await saveStage11State();'
          fb_insert = fb_anchor + '\n  stage12State = normalizeStage12State(fileStore.stage12);\n  await saveStage12State();'
          if 'stage12State = normalizeStage12State(fileStore.stage12)' not in s:
              s = s.replace(fb_anchor, fb_insert)

          helper_anchor = 'function stage11Actor(session:Session):Stage11Actor {'
          helper = '''function stage12Actor(session: Session): Stage12Actor {\n  const e = session.player.life.employment ?? null;\n  const business = e ? STAGE12_BUSINESSES.find((b) => b.id === e.workplaceId) : null;\n  const qualifications = business?.requiredQualification ? [business.requiredQualification] : [];\n  return { actorId: session.player.id, workplaceId: e?.workplaceId ?? "", rank: Number(e?.rank ?? 0), onDuty: e?.onDuty === true, uniform: !!e && e.uniformWorkplaceId === e.workplaceId, qualifications, x: session.player.x, z: session.player.z };\n}\nfunction stage12Payload(session: Session) {\n  const actor = stage12Actor(session);\n  const ownShifts = stage12State.shifts.filter((x) => x.actorId === session.player.id).slice(-20).reverse();\n  const facility = Object.values(stage12State.facilities).find((f) => f.businessId === actor.workplaceId) ?? null;\n  const access = facility ? checkStage12FacilityAccess(stage12State, actor, facility.id) : { ok: false, reason: "no assigned Stage 12 workplace" };\n  return { type: "stage12State", businesses: STAGE12_BUSINESSES, facilities: STAGE12_FACILITIES, productions: STAGE12_PRODUCTIONS, maintenance: stage12State.maintenance, shifts: ownShifts, inventory: session.player.inventory, cash: session.player.cash, workplaceId: actor.workplaceId || null, rank: actor.rank, rankTitle: actor.workplaceId && actor.rank ? workplaceRankTitle(actor.workplaceId, actor.rank) : "", onDuty: actor.onDuty, uniform: actor.uniform, qualifications: actor.qualifications, facilityAccess: access.ok };\n}\nfunction stage12Result(session: Session, action: string, ok: boolean, result: unknown = null, message = "") { send(session.socket, { ...stage12Payload(session), type: "stage12ActionResult", action, ok, result: ok ? result : null, message }); }\nfunction broadcastStage12States() { for (const session of players.values()) send(session.socket, stage12Payload(session)); }\n\n'''
          if 'function stage12Actor(session:' not in s:
              s = s.replace(helper_anchor, helper + helper_anchor)

          handler_anchor = '      if (message.type === "getStage11State") {'
          handlers = '''      if (message.type === "getStage12State") { stage12Result(session, "state", true); return; }\n      if (message.type === "stage12FacilityAccess") {\n        const r = checkStage12FacilityAccess(stage12State, stage12Actor(session), String(message.facilityId ?? ""));\n        stage12Result(session, "facility-access", r.ok, null, r.ok ? "Facility access approved." : r.reason); return;\n      }\n      if (message.type === "stage12StartShift") {\n        const actor = stage12Actor(session);\n        try {\n          const shift = startStage12Shift(stage12State, actor, String(message.requestId ?? ""), String(message.facilityId ?? ""), message.productionId ? String(message.productionId) : null, Date.now());\n          await saveStage12State(); stage12Result(session, "shift-start", true, shift, "Shift started.");\n        } catch (error) { stage12Result(session, "shift-start", false, null, error instanceof Error ? error.message : "Shift start rejected."); }\n        return;\n      }\n      if (message.type === "stage12CompleteShift") {\n        await withMoneyMutation(async () => {\n          const actor = stage12Actor(session);\n          const beforeCash = session.player.cash;\n          const beforeInventory = { ...session.player.inventory };\n          stage12State.inventories[session.player.id] = { ...session.player.inventory };\n          try {\n            const shift = completeStage12Shift(stage12State, actor, String(message.requestId ?? ""), String(message.shiftId ?? ""), Date.now());\n            session.player.inventory = { ...stage12State.inventories[session.player.id] };\n            session.player.cash += shift.revenue;\n            await persistSession(session); await saveStage12State();\n            stage12Result(session, "shift-complete", true, shift, "Shift completed. Production output and pay were recorded."); broadcastStage12States();\n          } catch (error) { session.player.cash = beforeCash; session.player.inventory = beforeInventory; stage12Result(session, "shift-complete", false, null, error instanceof Error ? error.message : "Shift completion rejected."); }\n        }); return;\n      }\n      if (message.type === "stage12MaintainFacility") {\n        try { const amount = maintainStage12Facility(stage12State, stage12Actor(session), String(message.requestId ?? ""), String(message.facilityId ?? ""), Number(message.units), Date.now()); await saveStage12State(); stage12Result(session, "maintenance", true, { maintenance: amount }, "Facility maintenance recorded."); broadcastStage12States(); }\n        catch (error) { stage12Result(session, "maintenance", false, null, error instanceof Error ? error.message : "Maintenance rejected."); }\n        return;\n      }\n      if (message.type === "stage12EducationTask") {\n        await withMoneyMutation(async () => { try { const reward = awardStage12EducationTask(stage12State, stage12Actor(session), String(message.requestId ?? ""), Number(message.studentCount), Date.now()); session.player.cash += reward; await persistSession(session); await saveStage12State(); stage12Result(session, "education", true, { reward }, "Class completed and teacher pay recorded."); broadcastStage12States(); } catch (error) { stage12Result(session, "education", false, null, error instanceof Error ? error.message : "Education task rejected."); } }); return;\n      }\n      if (message.type === "stage12SchoolBusTrip") {\n        await withMoneyMutation(async () => { try { const reward = completeStage12SchoolBusTripExtra(stage12State, stage12Actor(session), String(message.requestId ?? ""), Number(message.distanceKm), Date.now()); session.player.cash += reward; await persistSession(session); await saveStage12State(); stage12Result(session, "school-bus", true, { reward }, "School transport route completed."); broadcastStage12States(); } catch (error) { stage12Result(session, "school-bus", false, null, error instanceof Error ? error.message : "School-bus route rejected."); } }); return;\n      }\n      if (message.type === "stage12ProfessionalTask") {\n        await withMoneyMutation(async () => { try { const reward = completeStage12ProfessionalTaskExtra(stage12State, stage12Actor(session), String(message.requestId ?? ""), Date.now()); session.player.cash += reward; await persistSession(session); await saveStage12State(); stage12Result(session, "professional", true, { reward }, "Professional duty completed and pay recorded."); broadcastStage12States(); } catch (error) { stage12Result(session, "professional", false, null, error instanceof Error ? error.message : "Professional task rejected."); } }); return;\n      }\n\n'''
          if 'message.type === "getStage12State"' not in s:
              s = s.replace(handler_anchor, handlers + handler_anchor)

          p.write_text(s)
          PY
      - name: Validate integrated server
        run: |
          npm run typecheck --workspace nigeria-rp-game-server
          npm run build --workspace nigeria-rp-game-server
      - name: Update Stage 12 CI coverage
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/game-server.yml'); s=p.read_text()
          needle='      - name: Test Stage 11 personal services and utilities\n        run: npm run test:stage11 --workspace nigeria-rp-game-server\n'
          add=needle+'\n      - name: Test Stage 12 education, offices and industry\n        run: npm run test:stage12 --workspace nigeria-rp-game-server\n'
          if 'Test Stage 12 education, offices and industry' not in s: s=s.replace(needle,add)
          p.write_text(s)
          PY
      - name: Commit integrated Stage 12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/game-server/src/server.ts .github/workflows/game-server.yml
          git diff --cached --quiet || git commit -m "Stage 12: complete live gameplay integration [skip ci]"
          git push
