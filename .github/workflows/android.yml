name: NRS Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    name: Build NRS Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: true
          swap-storage: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: game/Library
          key: nrs-unity-library-Android-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
          restore-keys: |
            nrs-unity-library-Android-

      - name: Check Unity secrets
        shell: bash
        run: |
          test -n "${{ secrets.UNITY_LICENSE }}" || { echo "::error::UNITY_LICENSE GitHub secret is missing."; exit 1; }
          test -n "${{ secrets.UNITY_EMAIL }}" || { echo "::error::UNITY_EMAIL GitHub secret is missing."; exit 1; }
          test -n "${{ secrets.UNITY_PASSWORD }}" || { echo "::error::UNITY_PASSWORD GitHub secret is missing."; exit 1; }

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: game
          unityVersion: 2022.3.45f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: NrsBuild.BuildAndroid
          versioning: None

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NRS-Android-Test-APK
          path: build/Android/*.apk
          if-no-files-found: error
