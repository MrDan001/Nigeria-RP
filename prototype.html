<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#071018">
  <title>NRS • Browser Multiplayer Prototype</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f6f8fb;background:#071018}
    *{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#071018}body{touch-action:none}
    button,input{font:inherit}button{cursor:pointer}
    #game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
    .hud{position:fixed;inset:0;pointer-events:none}
    .panel{background:rgba(7,14,20,.76);border:1px solid rgba(255,255,255,.13);box-shadow:0 12px 30px rgba(0,0,0,.24);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px}
    .topbar{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#28a9ff,#0063b3);font-weight:900}
    .brand strong{display:block;font-size:11px;letter-spacing:1.4px;white-space:nowrap}.brand div span{display:block;margin-top:2px;color:rgba(255,255,255,.58);font-size:8px;letter-spacing:1px}
    .presence{display:flex;align-items:center;gap:8px;font-size:9px;color:rgba(255,255,255,.62);white-space:nowrap}.presence b{color:#fff}.divider{width:1px;height:14px;background:rgba(255,255,255,.16)}
    .good{color:#6ee7a4!important}.pending{color:#ffd166!important}.bad{color:#ff7b8f!important}
    .status{position:absolute;top:76px;left:12px;max-width:min(82vw,420px);padding:9px 11px;color:rgba(255,255,255,.78);font-size:11px;line-height:1.35}
    .player-panel{position:absolute;top:134px;left:12px;width:min(280px,calc(100vw - 24px));padding:12px}.eyebrow{font-size:8px;letter-spacing:1.6px;color:rgba(255,255,255,.42)}
    .identity-row{display:flex;gap:7px;margin-top:8px}#player-name{min-width:0;flex:1;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);color:#fff;border-radius:10px;padding:10px;outline:none}
    #join-button{border:0;border-radius:10px;padding:0 11px;background:#f2f5f8;color:#071018;font-size:9px;font-weight:900;letter-spacing:.6px}.role-chip{display:inline-block;margin-top:9px;padding:5px 8px;border-radius:999px;background:rgba(40,169,255,.12);border:1px solid rgba(40,169,255,.22);color:#83caff;font-size:8px;letter-spacing:1px}
    .phase-badge{position:fixed;right:12px;top:calc(72px + env(safe-area-inset-top));padding:6px 9px;border-radius:999px;background:rgba(7,14,20,.66);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.45);font-size:7px;letter-spacing:1.2px}
    #controls{position:fixed;inset:0;pointer-events:none}
    .joystick{position:absolute;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:122px;height:122px;border-radius:50%;background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.18),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.17);box-shadow:inset 0 0 0 8px rgba(255,255,255,.025),0 16px 35px rgba(0,0,0,.25);pointer-events:auto;touch-action:none}
    .joystick-label{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:rgba(255,255,255,.32);font-size:8px;font-weight:800;letter-spacing:1.2px}.stick{position:absolute;width:54px;height:54px;left:34px;top:34px;border-radius:50%;background:rgba(245,249,252,.82);box-shadow:0 8px 18px rgba(0,0,0,.22)}
    .action-stack{position:absolute;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
    .primary-action,.secondary-action{pointer-events:auto;border-radius:17px;font-weight:900;letter-spacing:.8px;padding:15px 17px;min-width:112px;touch-action:manipulation}
    .primary-action{border:1px solid rgba(255,255,255,.2);background:rgba(8,18,27,.88);color:#fff;box-shadow:0 10px 25px rgba(0,0,0,.2)}
    .secondary-action{min-width:82px;padding:11px 14px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.08);color:rgba(255,255,255,.82);font-size:10px}
    @media(max-width:680px){.player-panel{top:128px;width:250px}.phase-badge{top:auto;bottom:10px;right:50%;transform:translateX(50%)}}
  </style>
</head>
<body>
<main id="app">
  <canvas id="game-canvas"></canvas>
  <section class="hud">
    <header class="topbar panel">
      <div class="brand"><span class="brand-mark">N</span><div><strong>NIGERIAN ROLEPLAY</strong><span>PORT HARCOURT • ONLINE WORLD</span></div></div>
      <div class="presence"><span id="connection" class="pending">CONNECTING</span><span class="divider"></span><span><b id="player-count">0</b> PLAYERS</span></div>
    </header>
    <div id="status" class="status panel">Preparing the Port Harcourt multiplayer test world…</div>
    <section class="player-panel panel">
      <span class="eyebrow">YOUR IDENTITY</span>
      <div class="identity-row"><input id="player-name" maxlength="20" value="Player" aria-label="Player name"><button id="join-button" type="button">SET NAME</button></div>
      <div class="role-chip">CIVILIAN • NEW CITIZEN</div>
    </section>
  </section>
  <section id="controls">
    <div id="joystick" class="joystick"><div class="joystick-label">MOVE</div><div id="stick" class="stick"></div></div>
    <div class="action-stack"><button id="camera" class="secondary-action" type="button">CAMERA</button><button id="interact" class="primary-action" type="button">INTERACT</button></div>
  </section>
  <div class="phase-badge">PHASE 1 • MULTIPLAYER LAB</div>
</main>

<script type="module">
import {Application,Color,Entity,FILLMODE_FILL_WINDOW,RESOLUTION_AUTO,StandardMaterial} from "https://esm.sh/playcanvas@2.23.1";

const SERVER_URL="wss://nigeria-rp-production.up.railway.app";
const $=id=>document.getElementById(id);
const canvas=$("game-canvas"),connection=$("connection"),status=$("status"),count=$("player-count"),joystick=$("joystick"),stick=$("stick"),interact=$("interact"),cameraButton=$("camera"),nameInput=$("player-name"),joinButton=$("join-button");

const app=new Application(canvas,{graphicsDeviceOptions:{alpha:true,antialias:true}});
app.setCanvasFillMode(FILLMODE_FILL_WINDOW);app.setCanvasResolution(RESOLUTION_AUTO);

const camera=new Entity("Camera");
camera.addComponent("camera",{clearColor:new Color(.03,.05,.08,1),fov:60,farClip:250});
app.root.addChild(camera);

const sun=new Entity("Sun");sun.addComponent("light",{type:"directional",intensity:2.0,castShadows:false});sun.setEulerAngles(55,35,0);app.root.addChild(sun);
const ambient=new Entity("Ambient");ambient.addComponent("light",{type:"omni",intensity:1,range:120});ambient.setPosition(0,18,0);app.root.addChild(ambient);

const ground=new Entity("Ground");ground.addComponent("render",{type:"box"});ground.setLocalScale(90,.25,90);ground.setPosition(0,-.15,0);
const gm=new StandardMaterial();gm.diffuse.set(.09,.14,.11);gm.roughness=.92;gm.update();ground.render.material=gm;app.root.addChild(ground);

function block(name,x,z,w,h,d){const e=new Entity(name);e.addComponent("render",{type:"box"});e.setPosition(x,h/2,z);e.setLocalScale(w,h,d);const m=new StandardMaterial();m.diffuse.set(.18,.2,.23);m.roughness=.9;m.update();e.render.material=m;app.root.addChild(e)}
block("RoadNS",0,0,90,.08,5);block("RoadEW",0,0,5,.08,90);block("BlockA",-13,-11,11,4,10);block("BlockB",14,-11,12,6,11);block("BlockC",-14,13,14,5,10);block("BlockD",15,14,10,3.5,12);

const players=new Map();let localId="";let ws=null;let timer=null;let seq=0;let move={forward:0,strafe:0};
const keys=new Set();addEventListener("keydown",e=>keys.add(e.key.toLowerCase()));addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));

function mat(r,g,b){const m=new StandardMaterial();m.diffuse.set(r,g,b);m.roughness=.86;m.update();return m}
function playerEntity(p,local){const e=new Entity(p.name||"Player");e.addComponent("render",{type:"capsule"});e.setPosition(p.x,1,p.z);e.setLocalScale(.8,1.8,.8);e.render.material=local?mat(.12,.62,1):mat(.95,.35,.2);app.root.addChild(e);players.set(p.id,e);return e}
function apply(list){const live=new Set(list.map(p=>p.id));for(const [id,e] of players){if(!live.has(id)){e.destroy();players.delete(id)}}for(const p of list){let e=players.get(p.id);if(!e)e=playerEntity(p,p.id===localId);e.setPosition(p.x,1,p.z);e.setEulerAngles(0,p.yaw*180/Math.PI,0)}count.textContent=list.length}
function send(p){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(p))}
function state(label,msg,cls){connection.textContent=label;connection.className=cls;status.textContent=msg}
function reconnect(){if(timer)return;timer=setTimeout(()=>{timer=null;connect()},1500)}
function connect(){ws=new WebSocket(SERVER_URL);state("CONNECTING","Connecting to the authoritative NRS server…","pending");ws.onopen=()=>{state("ONLINE","Connected. Your world state is server-authoritative.","good");send({type:"hello",name:nameInput.value.trim().slice(0,20)||"Player"})};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==="connected"){localId=m.playerId;apply(m.players)}else if(m.type==="snapshot")apply(m.players);else if(m.type==="interactionResult")status.textContent=m.message||"Interaction request processed by the server."};ws.onclose=()=>{state("OFFLINE","Connection lost. Reconnecting automatically…","bad");reconnect()};ws.onerror=()=>state("ERROR","Network error. Retrying the game server connection…","bad")}
connect();

function setStick(x,y){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=x-cx,dy=y-cy,max=38,len=Math.hypot(dx,dy)||1,scale=Math.min(1,max/len);stick.style.transform=`translate(${dx*scale}px,${dy*scale}px)`;move={forward:-dy/38*scale,strafe:dx/38*scale}}
function resetStick(){stick.style.transform="translate(0,0)";move={forward:0,strafe:0}}
joystick.addEventListener("pointerdown",e=>{joystick.setPointerCapture(e.pointerId);setStick(e.clientX,e.clientY)});joystick.addEventListener("pointermove",e=>{if(e.buttons)setStick(e.clientX,e.clientY)});joystick.addEventListener("pointerup",resetStick);joystick.addEventListener("pointercancel",resetStick);
interact.onclick=()=>send({type:"interact"});
joinButton.onclick=()=>{const n=nameInput.value.trim().slice(0,20)||"Player";nameInput.value=n;send({type:"hello",name:n});status.textContent=`Player name set to ${n}.`};

let lastSend=0;
app.on("update",dt=>{let f=move.forward,s=move.strafe;if(keys.has("w")||keys.has("arrowup"))f+=1;if(keys.has("s")||keys.has("arrowdown"))f-=1;if(keys.has("d")||keys.has("arrowright"))s+=1;if(keys.has("a")||keys.has("arrowleft"))s-=1;const n=Math.hypot(f,s);if(n>1){f/=n;s/=n}const now=performance.now();if(now-lastSend>=50&&(Math.abs(f)>.01||Math.abs(s)>.01)){send({type:"input",input:{sequence:seq++,forward:f,strafe:s}});lastSend=now}
const local=localId?players.get(localId):null;if(local){const p=local.getPosition(),c=camera.getPosition(),t=Math.min(1,dt*5);camera.setPosition(c.x+(p.x-c.x)*t,c.y+(p.y+8-c.y)*t,c.z+(p.z+11-c.z)*t);camera.lookAt(p.x,p.y,p.z)}lastSend=now});
cameraButton.onclick=()=>{const local=localId?players.get(localId):null;if(local){const p=local.getPosition();camera.setPosition(p.x,p.y+10,p.z+14);camera.lookAt(p.x,p.y,p.z)}};
addEventListener("resize",()=>app.resizeCanvas());addEventListener("orientationchange",()=>app.resizeCanvas());
app.start();
</script>
</body>
</html>
