<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const M=c=>new THREE.MeshLambertMaterial({color:c});
function tex(w,h,fn,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(rx){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);}return t;}

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0xe9b98c,35,150);
const cam=new THREE.PerspectiveCamera(60,1,.1,220);
scene.add(new THREE.HemisphereLight(0xffd8b0,0x6a5a48,.95));
const sun=new THREE.DirectionalLight(0xffc58a,.9);sun.position.set(-30,18,-40);scene.add(sun);

addEventListener('resize',resize);resize();

/* ---------- Port Harcourt street ---------- */
function add(g,m,x,y,z,p){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);(p||scene).add(o);return o;}
const flat=(w,h,m,x,y,z)=>{const o=add(new THREE.PlaneGeometry(w,h),m,x,y,z);o.rotation.x=-Math.PI/2;return o;};
flat(500,500,M(0x5d7a45),0,0,0);flat(10,500,M(0x3a3d40),0,.01,0);
[-6.5,6.5].forEach(x=>flat(3,500,M(0xa9a59a),x,.02,0));[-5.2,5.2].forEach(x=>flat(.4,500,M(0xd8d4c8),x,.03,0));
for(let z=-200;z<=200;z+=6)flat(.3,2.5,M(0xeeeeee),0,.02,z);
const boxes=[],bld=[];
const winTex=(base,lit,rx,ry)=>tex(128,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let y=10;y<h-8;y+=26)for(let x=8;x<w-8;x+=22){g.fillStyle=Math.random()<lit?'#ffd98a':'#3b4a55';g.fillRect(x,y,12,15);}},rx,ry);
function building(x,z,w,d,h,col,side,lit){const pl=M(col),fr=new THREE.MeshLambertMaterial({map:winTex('#'+col.toString(16).padStart(6,'0'),lit,Math.max(1,Math.round(d/8)),Math.max(1,Math.round(h/7)))});const m=[pl,pl,pl,pl,pl,pl];m[side<0?0:1]=fr;add(new THREE.BoxGeometry(w,h,d),m,x,h/2,z);const b={x,z,hw:w/2,hd:d/2};boxes.push(b);bld.push(b);}
[[-17,-20,12,16,8,0xcdbf9d,-1,.3],[-17,6,12,14,6,0xb08a6a,-1,.2],[-17,32,12,16,11,0xc9ccd0,-1,.4],[-17,-52,12,18,14,0xd8d2c0,-1,.35],[17,-24,12,14,7,0xe0b878,1,.3],[17,2,12,14,9,0x9fb4c8,1,.4],[17,28,12,14,6,0xd6d0c4,1,.2],[17,-56,12,18,16,0xb8c8d8,1,.45],[-30,-90,16,16,34,0x8aa0b4,-1,.5],[30,-96,16,16,42,0x7f95aa,1,.5],[-30,-130,16,16,28,0xa09a90,-1,.4]].forEach(a=>building(...a));
const sign=(w,h,fn,x,y,z,ry)=>{const o=add(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex(512,Math.round(512*h/w),fn),fog:true}),x,y,z);o.rotation.y=ry;return o;};
sign(9,2.4,(g,w,h)=>{g.fillStyle='#14181c';g.fillRect(0,0,w,h);g.fillStyle='#fff';g.textAlign='center';g.font='bold 100px system-ui';g.fillText('PORT HARCOURT',w/2,h*.55);g.font='36px system-ui';g.fillText('RIVERS STATE',w/2,h*.85);},-10.9,8.6,-20,Math.PI/2);
const flag=(x,z)=>{add(new THREE.CylinderGeometry(.06,.06,8,6),M(0x888888),x,4,z);add(new THREE.PlaneGeometry(2.4,1.4),new THREE.MeshBasicMaterial({map:tex(30,14,(g,w,h)=>{g.fillStyle='#0a8f4a';g.fillRect(0,0,w,h);g.fillStyle='#fff';g.fillRect(10,0,10,h);}),side:THREE.DoubleSide}),x+1.2,7,z).rotation.y=Math.PI/2;};
flag(-8,-12);flag(8,-36);
add(new THREE.CylinderGeometry(.15,.15,9,6),M(0x555555),8.2,4.5,-62);
sign(8,3,(g,w,h)=>{g.fillStyle='#1d2a36';g.fillRect(0,0,w,h);g.textAlign='center';g.fillStyle='#fff';g.font='bold 62px system-ui';g.fillText('BIGGER DREAMS',w/2,h*.34);g.fillText('BIGGER HUSTLE',w/2,h*.6);g.fillStyle='#19c37d';g.font='bold 56px system-ui';g.fillText('NIGERIA RP',w/2,h*.88);},5,9.5,-62,0);
function palm(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);add(new THREE.CylinderGeometry(.13,.22,7,6),M(0x7a5c3c),0,3.5,0,g);const top=new THREE.Group();top.position.y=7;g.add(top);for(let i=0;i<7;i++){const lg=new THREE.Group(),pv=new THREE.Group();lg.rotation.y=i*.9;pv.rotation.x=.5;add(new THREE.BoxGeometry(.35,.04,3.4),M(0x2f8f3f),0,0,1.7,pv);lg.add(pv);top.add(lg);}}
for(let i=-12;i<=8;i++){palm(-8.8,i*14+3);palm(8.8,i*14+10);}
function car(x,z,col,ry){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);add(new THREE.BoxGeometry(1.9,.7,4.4),M(col),0,.7,0,g);add(new THREE.BoxGeometry(1.7,.6,2.3),M(0x1b2630),0,1.3,-.2,g);[[-.95,1.4],[.95,1.4],[-.95,-1.4],[.95,-1.4]].forEach(p=>{const w=add(new THREE.CylinderGeometry(.38,.38,.3,10),M(0x111111),p[0],.38,p[1],g);w.rotation.z=Math.PI/2;});boxes.push({x,z,hw:1.05,hd:2.3});}
car(-3.6,-10,0x0d0d0f,0);car(3.6,-42,0x8a1c1c,Math.PI);car(-3.6,-70,0x1d4a8a,0);car(3.6,-18,0xc9c9c9,Math.PI);

/* ---------- Character: black NIGERIA RP tee, cap, baggy jeans, sneakers ---------- */
const SKIN=[0x8d5524,0x6b3e1f,0x4a2a14,0xa8703c],HAIR=[0x111111,0x1a1a1a,0x2b1b12,0x111111];
const OUTFITS=[{top:0x151515,bottom:0x1c2330,shoe:0xf2f2f2,short:false,long:false,cap:true,print:true},{top:0x2f6f4f,bottom:0xa39373,shoe:0x3a2a20,short:false,long:false,cap:false},{top:0xc94a3a,bottom:0x2b2b2b,shoe:0x222222,short:true,long:false,cap:false},{top:0x3a5fa0,bottom:0x1d2a44,shoe:0xcccccc,short:false,long:true,cap:false}];
const look={o:0,s:0},mat={skin:M(0),top:M(0),bottom:M(0),shoe:M(0),hair:M(0),fore:M(0),shin:M(0),eye:M(0x111111),cap:M(0x101010)};
let capParts=[],printMesh;
function dress(){const o=OUTFITS[look.o],sk=SKIN[look.s];mat.skin.color.setHex(sk);mat.hair.color.setHex(HAIR[look.s]);mat.top.color.setHex(o.top);mat.bottom.color.setHex(o.bottom);mat.shoe.color.setHex(o.shoe);mat.fore.color.setHex(o.long?o.top:sk);mat.shin.color.setHex(o.short?sk:o.bottom);capParts.forEach(c=>c.visible=!!o.cap);if(printMesh)printMesh.visible=!!o.print;}
const player=new THREE.Group();scene.add(player);const model=new THREE.Group();player.add(model);const upper=new THREE.Group();upper.position.y=.92;model.add(upper);
const limb=(len,r,m)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.88,len,8),m);o.position.y=-len/2;return o;};
add(new THREE.BoxGeometry(.4,.18,.23),mat.bottom,0,.92,0,model);add(new THREE.BoxGeometry(.42,.58,.23),mat.top,0,.29,0,upper);add(new THREE.CylinderGeometry(.045,.05,.1,8),mat.skin,0,.62,0,upper);
const head=add(new THREE.SphereGeometry(.115,12,10),mat.skin,0,.75,0,upper);head.scale.set(.95,1.1,1);const hair=add(new THREE.SphereGeometry(.12,12,8),mat.hair,0,.79,-.005,upper);hair.scale.set(1,.72,1.04);[-1,1].forEach(s=>add(new THREE.SphereGeometry(.014,6,6),mat.eye,s*.04,.76,.108,upper));
capParts=[add(new THREE.SphereGeometry(.127,12,8,0,Math.PI*2,0,Math.PI/2),mat.cap,0,.78,-.005,upper),add(new THREE.BoxGeometry(.17,.014,.11),mat.cap,0,.8,.13,upper)];
printMesh=add(new THREE.PlaneGeometry(.34,.34),new THREE.MeshBasicMaterial({transparent:true,map:tex(256,256,(g,w,h)=>{g.textAlign='center';g.fillStyle='#fff';g.font='bold 72px system-ui';g.fillText('NIGERIA',w/2,100);g.fillStyle='#19c37d';g.font='bold 120px system-ui';g.fillText('RP',w/2,215);})}),0,.3,-.118,upper);printMesh.rotation.y=Math.PI;
const arm=[],elbow=[],leg=[],knee=[];[-1,1].forEach((s,i)=>{const a=new THREE.Group();a.position.set(s*.27,.55,0);upper.add(a);add(new THREE.SphereGeometry(.065,8,6),mat.top,0,0,0,a);a.add(limb(.3,.062,mat.top));const e=new THREE.Group();e.position.y=-.3;a.add(e);e.add(limb(.28,.046,mat.fore));add(new THREE.SphereGeometry(.05,8,6),mat.skin,0,-.3,0,e);arm[i]=a;elbow[i]=e;const l=new THREE.Group();l.position.set(s*.11,.92,0);model.add(l);l.add(limb(.45,.115,mat.bottom));const k=new THREE.Group();k.position.y=-.45;l.add(k);k.add(limb(.45,.1,mat.shin));add(new THREE.BoxGeometry(.13,.08,.28),mat.shoe,0,-.46,.06,k);leg[i]=l;knee[i]=k;});dress();
const shadow=flat(.9,.9,new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.3}),0,.04,0);

/* ---------- Input ---------- */
const inp={x:0,y:0},keys={};let sprint=false;addEventListener('keydown',e=>{if(e.target.tagName!=='INPUT')keys[e.code]=true;});addEventListener('keyup',e=>keys[e.code]=false);
const joy=$('joy'),knob=$('knob');let jid=null;
function joyMove(e){const r=joy.getBoundingClientRect(),R=r.width/2;let x=(e.clientX-(r.left+R))/R,y=(e.clientY-(r.top+R))/R;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}if(m<.12){inp.x=0;inp.y=0;}else{inp.x=x;inp.y=-y;}knob.style.transform='translate('+(x*R*.5)+'px,'+(y*R*.5)+'px)';}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);joyMove(e);});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e);});const jend=e=>{if(e.pointerId===jid){jid=null;inp.x=0;inp.y=0;knob.style.transform='';}};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
let camYaw=0,camPitch=.3,lid=null,lx=0,ly=0,draggingCam=false;const cv=$('c');
cv.addEventListener('pointerdown',e=>{if(lid===null){lid=e.pointerId;draggingCam=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(lid);}});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==lid)return;camYaw-=(e.clientX-lx)*.005;camPitch=clamp(camPitch+(e.clientY-ly)*.004,.05,1.1);lx=e.clientX;ly=e.clientY;});
const lend=e=>{if(e.pointerId===lid){lid=null;draggingCam=false;}};cv.addEventListener('pointerup',lend);cv.addEventListener('pointercancel',lend);
$('gear').onclick=()=>{const g=$('gp');g.style.display=g.style.display==='flex'?'none':'flex';};$('bo').onclick=()=>{look.o=(look.o+1)%OUTFITS.length;dress();};$('bs').onclick=()=>{look.s=(look.s+1)%SKIN.length;dress();};$('run').onclick=()=>{sprint=!sprint;$('run').classList.toggle('on',sprint);};$('cf').onsubmit=e=>{e.preventDefault();const v=$('ci').value.trim();if(!v)return;const d=document.createElement('div');d.innerHTML='<b>You:</b> ';d.append(v);$('log').append(d);$('log').scrollTop=1e5;$('ci').value='';};

/* ---------- Movement: camera-relative, delta-time, one update loop ---------- */
const pos=new THREE.Vector3(0,0,24),vel=new THREE.Vector3(),focus=new THREE.Vector3(0,1.4,24);let face=Math.PI,speed=0,phase=0;
function update(dt){let ix=inp.x,iy=inp.y;if(keys.KeyW||keys.ArrowUp)iy+=1;if(keys.KeyS||keys.ArrowDown)iy-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;if(keys.KeyA||keys.ArrowLeft)ix-=1;let mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag;mag=1;}
const s=Math.sin(camYaw),c=Math.cos(camYaw);let tx=0,tz=0;if(mag>0){const dx=ix*c-iy*s,dz=-ix*s-iy*c,l=Math.hypot(dx,dz),top=sprint?6.3:4.5;const sp=mag<.7?2*(mag/.7):2+(mag-.7)/.3*(top-2);tx=dx/l*sp;tz=dz/l*sp;}
const k=1-Math.exp(-dt*10);vel.x+=(tx-vel.x)*k;vel.z+=(tz-vel.z)*k;pos.x+=vel.x*dt;pos.z+=vel.z*dt;
for(const b of boxes){const ox=pos.x-b.x,oz=pos.z-b.z,px=b.hw+.3-Math.abs(ox),pz=b.hd+.3-Math.abs(oz);if(px>0&&pz>0){if(px<pz)pos.x+=Math.sign(ox||1)*px;else pos.z+=Math.sign(oz||1)*pz;}}
pos.x=clamp(pos.x,-240,240);pos.z=clamp(pos.z,-240,240);speed=Math.hypot(vel.x,vel.z);if(speed>.3){let d=Math.atan2(vel.x,vel.z)-face;d=Math.atan2(Math.sin(d),Math.cos(d));face+=d*(1-Math.exp(-dt*12));}player.position.copy(pos);model.rotation.y=face;shadow.position.set(pos.x,.04,pos.z);}
function animate(dt,t){const run=clamp((speed-2)/2.5,0,1),amp=clamp(speed/2,0,1)*(.55+.4*run);phase+=speed*dt*(4.2-1.6*run);const dm=(o,v)=>{o.rotation.x+=(v-o.rotation.x)*Math.min(1,dt*18);};[0,1].forEach(i=>{const p=phase+i*Math.PI,sw=Math.sin(p);dm(leg[i],-sw*amp*.9);dm(knee[i],Math.max(0,Math.cos(p))*amp*(.9+.5*run));dm(arm[i],sw*amp*.8);dm(elbow[i],-(.2+.7*run)*amp-.05);});dm(upper,.04+.14*run*amp);model.position.y=Math.abs(Math.sin(phase))*.04*amp;upper.scale.y=1+Math.sin(t*2)*.006;}
function updateCam(dt){const f=1-Math.exp(-dt*14);focus.x+=(pos.x-focus.x)*f;focus.z+=(pos.z-focus.z)*f;focus.y=1.4;const d=4.6,cp=Math.cos(camPitch);cam.position.set(focus.x+Math.sin(camYaw)*cp*d,focus.y+Math.sin(camPitch)*d,focus.z+Math.cos(camYaw)*cp*d);cam.lookAt(focus);}

/* ---------- HUD: compass and minimap ---------- */
const cc=$('comp').getContext('2d'),LAB={0:'N',45:'NE',90:'E',135:'SE',180:'S',225:'SW',270:'W',315:'NW'};
function drawComp(){const w=880,h=84,hd=((-camYaw*57.2958)%360+360)%360,ppd=w/110;cc.clearRect(0,0,w,h);cc.textAlign='center';for(let d=Math.floor((hd-60)/15)*15;d<=hd+60;d+=15){const x=w/2+(d-hd)*ppd,n=((d%360)+360)%360,L=LAB[n];cc.fillStyle=L?'#fff':'rgba(255,255,255,.55)';cc.font=(L?'bold 34px':'24px')+' system-ui';cc.fillText(L||n,x,66);cc.fillRect(x-1.5,12,3,L?16:10);}cc.fillStyle='#fff';cc.beginPath();cc.moveTo(w/2-10,0);cc.lineTo(w/2+10,0);cc.lineTo(w/2,13);cc.fill();}
const mc=$('mm').getContext('2d');function drawMap(){const R=120;mc.clearRect(0,0,240,240);mc.save();mc.beginPath();mc.arc(R,R,118,0,7);mc.clip();mc.fillStyle='#16313a';mc.fillRect(0,0,240,240);mc.translate(R,R);mc.rotate(camYaw);mc.scale(1.6,1.6);mc.translate(-pos.x,-pos.z);mc.fillStyle='#4b535a';mc.fillRect(-5,-500,10,1000);mc.fillStyle='#78808a';mc.fillRect(-8,-500,3,1000);mc.fillRect(5,-500,3,1000);mc.fillStyle='#9aa0a6';for(const b of bld)mc.fillRect(b.x-b.hw,b.z-b.hd,b.hw*2,b.hd*2);mc.restore();mc.save();mc.translate(R,R);mc.rotate(Math.PI-(face-camYaw));mc.fillStyle='#4ade80';mc.strokeStyle='#0b2';mc.beginPath();mc.moveTo(0,-11);mc.lineTo(8,9);mc.lineTo(0,5);mc.lineTo(-8,9);mc.closePath();mc.fill();mc.restore();mc.fillStyle='#fff';mc.font='bold 22px system-ui';mc.textAlign='center';mc.fillText('N',R+Math.sin(camYaw)*98,R-Math.cos(camYaw)*98+8);}
let last=performance.now(),t=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;update(dt);animate(dt,t);updateCam(dt);renderer.render(scene,cam);drawComp();drawMap();}requestAnimationFrame(loop);
</script></body></html>
